# 通用多平台真机验收（fry_sbuild 公开仓）：versions/<软件>/<版本目录>/manifest.json 里登记了哪些平台，就在哪些 GitHub 真机上照单验收。
#   本仓只放二进制 + 验收脚本，不放源码。正本在 ci/workflows/，由私有仓的 fry_sbuild publish 复制到 .github/workflows/。
name: fry_verify

on:
  workflow_dispatch:
    inputs:
      version_dir:
        description: "versions/ 下的相对路径，例如 rip_workbench/_261109_0500_v3.2.0_exe"
        required: true
        type: string

concurrency:
  group: fry-verify-${{ inputs.version_dir }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5
      - id: m
        env:
          VDIR: ${{ inputs.version_dir }}
        run: |
          python3 - <<'PY'
          import json, os
          runner = {"linux-x64": "ubuntu-22.04", "linux-arm64": "ubuntu-24.04-arm", "darwin-arm64": "macos-15",
                    "darwin-x64": "macos-15-intel", "win32-x64": "windows-2022"}
          man = json.load(open(os.path.join("versions", os.environ["VDIR"], "manifest.json"), encoding="utf-8"))
          inc = [{"target": t, "runner": runner[t]} for t in sorted(man["targets"])]
          open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8").write("matrix=" + json.dumps({"include": inc}) + "\n")
          print(inc)
          PY

  verify:
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: 验收 ${{ matrix.target }}
        shell: bash
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
          QT_QPA_PLATFORM: "offscreen"
          GH_TOKEN: ${{ github.token }}
        run: python ci/fry_ci_target.py --version-dir "versions/${{ inputs.version_dir }}" --target "${{ matrix.target }}" --out "_ci_out/${{ matrix.target }}"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: verified-${{ matrix.target }}
          path: _ci_out/${{ matrix.target }}
          if-no-files-found: error
          retention-days: 30

  summary:
    needs: verify
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with:
          pattern: verified-*
          path: _ci_all
      - name: 汇总（每个登记的平台都必须通过）
        env:
          PYTHONUTF8: "1"
        run: python3 ci/fry_ci_summary.py --version-dir "versions/${{ inputs.version_dir }}" --verdicts _ci_all --out _ci_all/summary.json
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: verified-summary
          path: _ci_all/summary.json
          retention-days: 30
